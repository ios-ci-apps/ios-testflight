name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # This repository is public: its own CI must never run on a self-hosted runner. The action and
      # examples/ are meant for self-hosted Macs; the private app repository that calls them picks runs-on.
      - name: No self-hosted runners in this repository
        run: |
          if grep -rnE '^[[:space:]]*(runs-on:.*|-[[:space:]]*)self-hosted' .github/workflows/; then
            echo "::error::Workflows in this repository must run on GitHub-hosted runners only."
            exit 1
          fi
      - name: ShellCheck
        run: shellcheck -x bin/* tests/run.sh
      - name: YAML parses
        run: python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ('action.yml', 'examples/testflight.yml')]"
      - name: Tests
        run: tests/run.sh
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
